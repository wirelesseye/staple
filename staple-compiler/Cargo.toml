[package]
name = "staple-compiler"
version = "0.1.0"
edition = "2024"

[features]
lowered-emitter = []
# Test instrumentation only, never a build configuration: every emitted
# module is also emitted by the other backend and compared (Stage 5.9 gate:
# `cargo nextest run --workspace --features
# staple-compiler/differential-shadow,staple-compiler/lowered-emitter`).
differential-shadow = []

[dependencies]
staple-project = { path = "../staple-project" }
staple-syntax = { path = "../staple-syntax" }
inkwell = { version = "0.10.0", features = ["llvm21-1"] }
