[package]
name = "staple"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "staple"
path = "src/main.rs"

[dependencies]
staple-compiler = { path = "../staple-compiler" }
staple-project = { path = "../staple-project" }
staple-syntax = { path = "../staple-syntax" }
inkwell = { version = "0.10.0", features = ["llvm21-1"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
